# Nginx — Rueda de Negocios
# Sirve la web Next.js (:3000) y enruta la API NestJS (:3334) bajo el mismo
# origen para el modo dominio+HTTPS:
#   /api/*       → backend (se quita el prefijo /api)
#   /socket.io/  → backend (websockets de Socket.IO)
#   /uploads/    → backend (imágenes subidas)
#   /*           → web
# En modo IP el frontend sigue llamando directo a :3334 — ambas rutas conviven.
# HTTPS: cuando el DNS apunte aquí, certbot --nginx agrega el bloque 443 solo.

limit_req_zone $binary_remote_addr zone=uploads_publicos:10m rate=10r/m;

server {
    listen 80;
    server_name app.ruedadenegocios.univalle.edu ruedadenegocios.univalle.edu _;

    client_max_body_size 15M;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

    location = /api/public/imagenes/upload {
        limit_req zone=uploads_publicos burst=4 nodelay;
        client_max_body_size 5M;
        proxy_pass http://127.0.0.1:3334/public/imagenes/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API bajo /api (el proxy quita el prefijo: /api/auth/login → /auth/login)
    location /api/ {
        proxy_pass http://127.0.0.1:3334/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Socket.IO (tiempo real) — requiere upgrade de websocket
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3334;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Imágenes subidas
    location /uploads/ {
        proxy_pass http://127.0.0.1:3334;
        proxy_set_header Host $host;
    }

    # Web Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
