# Nginx — Rueda de Negocios
# :80 sirve la web Next.js (:3000). El backend NestJS se expone directo en :3334
# (incluye Socket.IO y /uploads), así no hay colisión de rutas como /auth/login
# que existen tanto en la web como en la API.
#
# Cuando tengan dominio: crear un server para api.dominio.com → 127.0.0.1:3334
# (con los mismos headers websocket de abajo) y correr certbot para HTTPS.

server {
    listen 80;
    server_name _;

    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Websocket (HMR / streaming de Next)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
